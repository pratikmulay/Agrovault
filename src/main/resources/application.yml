spring:
  application:
    name: agrovault

  # SQL Init
  sql:
    init:
      mode: always

  # PostgreSQL Datasource
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrovault_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 600000

# JWT
agrovault:
  jwt:
    secret: ${JWT_SECRET:AgroVaultSuperSecretKeyThatIsAtLeast256BitsLong!!}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
