spring:
  application:
    name: agrovault

  # SQL Init
  sql:
    init:
      mode: always

  # PostgreSQL Datasource
  datasource:
    url: jdbc:postgresql://localhost:5432/agrovault_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Cache
  cache:
    type: redis
    redis:
      time-to-live: 600000

# JWT
agrovault:
  jwt:
    secret: CHANGE_ME_SECRET_KEY_256_BIT
    expiration: 86400000
